name: Parrot checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcode-select -p
          swift --version
      - name: Scheduler and knowledge-base regressions
        run: scripts/test-fork.sh
      - name: Full application logic harness
        env:
          DYLD_FRAMEWORK_PATH: ${{ github.workspace }}/.build/release
        run: make test
      - name: Assemble local prototype
        run: |
          make app SIGN_IDENTITY=-
      - name: Run the signed bundle without build-directory libraries
        run: env -u DYLD_FRAMEWORK_PATH dist/Parrot.app/Contents/MacOS/Parrot --profile-test
      - name: Real speech detector regressions
        run: |
          for fixture in "$PWD"/dist/Parrot.app/Contents/Resources/portuguese-*.wav; do
            env -u DYLD_FRAMEWORK_PATH dist/Parrot.app/Contents/MacOS/Parrot --speech-gate-test "$fixture"
          done
      - name: Archive verified bundle
        run: ditto -c -k --sequesterRsrc --keepParent dist/Parrot.app dist/Parrot.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Parrot-macOS
          path: dist/Parrot.zip
